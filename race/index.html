<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>像素跑馬場</title>
<style>
  :root{
    --bg:#14162a; --panel:#232741; --panel2:#2d3252; --ink:#f4f0e8; --dim:#8b90b3;
    --gold:#ffcd75; --green:#63c74d; --red:#ef5d66; --blue:#4d9be6; --line:#0c0d1a;
    --border:#3a3f63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; justify-content:center;
    overscroll-behavior:none; touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  #app{
    width:100%; max-width:430px; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 8px calc(10px + env(safe-area-inset-bottom));
    gap:8px;
  }
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-weight:700;}

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; background:var(--panel);
    border:3px solid var(--line); box-shadow:0 4px 0 var(--line);
  }
  header .logo{font-weight:900; font-size:15px; letter-spacing:1px; color:var(--gold); white-space:nowrap;}
  header .bank{
    margin-left:auto; display:flex; align-items:baseline; gap:4px;
    background:var(--panel2); border:2px solid var(--border); padding:4px 8px;
  }
  header .bank .coin{color:var(--gold); font-size:13px;}
  header .bank #bankVal{font-size:16px; color:var(--gold);}
  .rno{
    background:var(--panel2); border:2px solid var(--border);
    padding:4px 7px; font-size:12px; color:var(--dim); white-space:nowrap;
  }
  .iconbtn{
    width:36px;height:36px; flex:0 0 36px;
    background:var(--panel2); border:2px solid var(--border); color:var(--ink);
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{transform:translateY(2px);}

  /* ---------- race canvas ---------- */
  #stageWrap{position:relative; border:3px solid var(--line); box-shadow:0 4px 0 var(--line); background:#000;}
  #cv{display:block; width:100%; image-rendering:pixelated; image-rendering:crisp-edges;}
  #raceMsg{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    font-size:22px; font-weight:900; color:#fff;
    text-shadow:2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
    letter-spacing:2px; pointer-events:none; opacity:0; transition:opacity .15s;
    white-space:nowrap;
  }
  #countdown{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:64px; font-weight:900; color:var(--gold);
    text-shadow:3px 3px 0 #000; pointer-events:none;
  }
  #liveBar{
    position:absolute; bottom:0; left:0; right:0;
    display:none; gap:6px; padding:4px 6px;
    background:rgba(12,13,26,.82); overflow:hidden; white-space:nowrap;
  }
  #liveBar .lb{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700;}
  #liveBar .lb i{width:10px;height:10px;display:inline-block;border:1px solid #000;}
  #liveBar .lb b{color:var(--gold);}

  /* ---------- odds board ---------- */
  #board{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .hcard{
    background:var(--panel); border:3px solid var(--border);
    padding:6px 7px; display:flex; flex-direction:column; gap:3px;
    cursor:pointer; position:relative; min-height:64px;
  }
  .hcard:active{transform:translateY(2px);}
  .hcard.sel{border-color:var(--gold); background:var(--panel2);}
  .hcard .r1{display:flex; align-items:center; gap:5px;}
  .hcard .cap{
    width:18px;height:18px; flex:0 0 18px; border:2px solid #000;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; color:#fff; text-shadow:1px 1px 0 #000;
  }
  .hcard .nm{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hcard .r2{display:flex; align-items:baseline; gap:6px;}
  .hcard .wodds{font-size:17px; color:var(--gold);}
  .hcard .podds{font-size:11px; color:var(--dim);}
  .hcard .r3{display:flex; gap:5px; font-size:10px; color:var(--dim); align-items:center;}
  .hcard .stars{color:var(--gold); letter-spacing:-1px;}
  .hcard .tag{border:1px solid var(--border); padding:0 3px;}
  .hcard .betmark{
    position:absolute; top:-6px; right:-4px; background:var(--red); color:#fff;
    font-size:10px; font-weight:900; padding:1px 5px; border:2px solid #000; display:none;
  }
  .hcard.hasbet .betmark{display:block;}

  /* ---------- controls ---------- */
  #controls{display:flex; flex-direction:column; gap:7px;}
  .ctlrow{display:flex; gap:6px; align-items:center;}
  .seg{display:flex; border:3px solid var(--border); background:var(--panel);}
  .seg button{
    background:none; border:none; color:var(--dim); font-weight:900; font-size:13px;
    padding:8px 14px; font-family:inherit;
  }
  .seg button.on{background:var(--gold); color:#1a1c2c;}
  .chips{display:flex; gap:6px; flex:1;}
  .chip{
    flex:1; padding:9px 0; text-align:center; font-weight:900; font-size:13px;
    background:var(--panel2); color:var(--ink); border:3px solid var(--border);
    font-family:ui-monospace,Menlo,monospace;
  }
  .chip.on{background:var(--green); color:#0c2210; border-color:#0c0d1a;}
  .chip:active{transform:translateY(2px);}
  #tickets{display:flex; flex-direction:column; gap:4px; max-height:88px; overflow-y:auto;}
  .tk{
    display:flex; align-items:center; gap:6px; font-size:12px;
    background:var(--panel); border:2px solid var(--border); padding:4px 7px;
  }
  .tk .tt{font-size:10px; font-weight:900; padding:1px 4px; border:1px solid var(--border);}
  .tk .tt.W{color:var(--gold);} .tk .tt.P{color:var(--blue);}
  .tk .amt{margin-left:auto; color:var(--gold);}
  .tk .x{
    background:var(--red); color:#fff; border:1px solid #000; width:20px; height:20px;
    font-weight:900; display:flex; align-items:center; justify-content:center; font-size:11px;
  }
  #go{
    padding:14px 0; font-size:17px; font-weight:900; letter-spacing:2px;
    background:var(--red); color:#fff; border:3px solid var(--line);
    box-shadow:0 4px 0 var(--line); font-family:inherit;
  }
  #go:disabled{background:var(--panel2); color:var(--dim); box-shadow:none;}
  #go:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--line);}

  /* ---------- modals ---------- */
  .modal{
    position:fixed; inset:0; background:rgba(10,11,22,.8);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal.show{display:flex;}
  .mbox{
    width:100%; max-width:380px; background:var(--panel);
    border:3px solid var(--line); box-shadow:0 6px 0 var(--line);
    padding:16px 14px; max-height:82dvh; overflow-y:auto;
  }
  .mbox h2{font-size:16px; color:var(--gold); text-align:center; letter-spacing:2px; margin-bottom:10px;}
  .rk{display:flex; align-items:center; gap:7px; padding:4px 6px; font-size:13px; border-bottom:1px solid var(--border);}
  .rk .pos{width:22px; font-weight:900; color:var(--dim);}
  .rk.first .pos{color:var(--gold);}
  .rk .cap{width:14px;height:14px; flex:0 0 14px; border:1px solid #000;}
  .rk .gap{margin-left:auto; color:var(--dim); font-size:11px;}
  .settle{margin-top:10px; border-top:2px solid var(--border); padding-top:8px;}
  .stk{display:flex; align-items:center; gap:6px; font-size:12px; padding:3px 0;}
  .stk .res{margin-left:auto; font-weight:900;}
  .stk .res.win{color:var(--green);} .stk .res.lose{color:var(--red);}
  .net{
    text-align:center; font-size:15px; margin:10px 0 4px; font-weight:900;
  }
  .net b{font-size:26px;}
  .net.pos b{color:var(--green);} .net.neg b{color:var(--red);} .net.zero b{color:var(--dim);}
  .mbtn{
    display:block; width:100%; margin-top:12px; padding:12px 0;
    background:var(--gold); color:#1a1c2c; font-weight:900; font-size:15px;
    border:3px solid var(--line); box-shadow:0 4px 0 var(--line); font-family:inherit; letter-spacing:2px;
  }
  .mbtn:active{transform:translateY(2px); box-shadow:none;}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:13px; margin-bottom:10px;}
  .statgrid div{background:var(--panel2); padding:7px 8px; border:2px solid var(--border);}
  .statgrid span{display:block; color:var(--dim); font-size:10px; margin-bottom:2px;}
  #spark{width:100%; height:64px; background:var(--panel2); border:2px solid var(--border); image-rendering:pixelated;}
  #doleBtn{
    display:none; margin:8px auto 0; padding:10px 22px;
    background:var(--blue); color:#fff; font-weight:900; border:3px solid var(--line);
    box-shadow:0 4px 0 var(--line); font-family:inherit; font-size:14px;
  }
  #toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:#000; color:var(--gold); font-size:13px; font-weight:700;
    padding:8px 16px; border:2px solid var(--gold); opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:60; white-space:nowrap;
  }
  .coverall{position:fixed; inset:0; z-index:40; display:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🏇 像素跑馬場</div>
    <div class="bank"><span class="coin">💰</span><span class="num" id="bankVal">1000</span></div>
    <div class="rno num" id="raceNoTag"></div>
    <button class="iconbtn" id="soundBtn" title="音效">🔊</button>
    <button class="iconbtn" id="statsBtn" title="战绩">📊</button>
  </header>

  <div id="stageWrap">
    <canvas id="cv" width="780" height="560"></canvas>
    <div id="raceMsg"></div>
    <div id="countdown"></div>

  </div>

  <div id="board"></div>

  <div id="controls">
    <div class="ctlrow">
      <div class="seg">
        <button id="typeW" class="on">独赢</button>
        <button id="typeP">位置</button>
      </div>

        <button class="chip on" data-v="50">50</button>

<div class="modal" id="resultModal"><div class="mbox">
  <h2 id="resTitle">🏁 赛 果</h2>
  <div id="ranks"></div>
  <div class="settle" id="settle"></div>
  <div class="net" id="netRow"></div>
  <button class="mbtn" id="nextBtn">下 一 场</button>
</div></div>

<div class="modal" id="statsModal"><div class="mbox">
  <h2>📊 战 绩</h2>
  <div class="statgrid" id="statGrid"></div>
  <canvas id="spark" width="320" height="64"></canvas>
  <button class="mbtn" id="closeStats">关 闭</button>
  <button class="mbtn" id="resetBtn" style="background:var(--red);color:#fff;font-size:12px;padding:8px 0;">重置全部数据</button>
</div></div>

<div id="toast"></div>
<div class="coverall" id="cover"></div>

<script>
'use strict';
/* =====================================================
   像素跑馬場 — single-file mobile horse racing betting game
   ===================================================== */

// ---------- persistent state ----------
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('pr_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('pr_'+k, JSON.stringify(v)); }catch(e){} }
};
let bank   = LS.get('bank', 1000);
let stats  = LS.get('stats', {races:0, staked:0, returned:0, paidTickets:0, tickets:0, biggestWin:0, dole:0, curve:[1000]});
let soundOn = LS.get('sound', true);

// ---------- utils ----------
const $ = s => document.querySelector(s);
const rnd = (a,b)=> a + Math.random()*(b-a);
const rndi = (a,b)=> Math.floor(rnd(a,b+1));
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
const fmt = n => n.toLocaleString('en-US');
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function softmax(xs){ const m=Math.max(...xs); const es=xs.map(x=>Math.exp(x-m)); const s=es.reduce((p,c)=>p+c,0); return es.map(e=>e/s); }

// ---------- audio (tiny synth, no assets) ----------
let AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f, dur=0.08, type='square', vol=0.12, when=0){
  if(!soundOn) return; const ctx=ac(); if(!ctx) return;
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
const sfx = {
  click(){ beep(660,0.05,'square',0.08); },
  chip(){ beep(880,0.05,'square',0.1); beep(1320,0.06,'square',0.08,0.05); },
  bell(){ beep(1568,0.1,'square',0.14); beep(1568,0.12,'square',0.12,0.16); },
  tick(){ beep(440,0.05,'square',0.1); },
  go(){ beep(880,0.3,'sawtooth',0.14); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.16,'square',0.13,i*0.13)); },
  cash(){ [988,1318,1568].forEach((f,i)=>beep(f,0.09,'square',0.14,i*0.07)); },
  lose(){ beep(220,0.25,'sawtooth',0.1); beep(175,0.3,'sawtooth',0.1,0.18); }
};

// ---------- horse pool ----------
const POOL = [
  {name:'火焰小子', coat:'#a26d3f', dark:'#6e4522', style:'front'},
  {name:'黑旋风',   coat:'#3b3c4f', dark:'#22232f', style:'close'},
  {name:'追风',     coat:'#c98a4b', dark:'#8a5a2b', style:'front'},
  {name:'铁蹄将军', coat:'#7a4a32', dark:'#4e2e1e', style:'pace'},
  {name:'闪电',     coat:'#e8d9b0', dark:'#b09a6a', style:'close'},
  {name:'夜神月',   coat:'#2e3040', dark:'#1b1c28', style:'pace'},
  {name:'金毛狮王', coat:'#d9a441', dark:'#9a712a', style:'front'},
  {name:'白玉麒麟', coat:'#e8e8e8', dark:'#a8a8a8', style:'pace'},
  {name:'赤兔',     coat:'#b13e53', dark:'#7a2838', style:'front'},
  {name:'乌云踏雪', coat:'#4a4a58', dark:'#2c2c36', style:'close'},
  {name:'小钢炮',   coat:'#c96f3a', dark:'#8a4a24', style:'front'},
  {name:'草原之王', coat:'#8a6a3a', dark:'#5c4626', style:'close'}
];
const SILKS = ['#ef5d66','#4d9be6','#63c74d','#ffcd75','#d057d8','#f2854d'];
const STYLE_TAG = {front:'前置', pace:'跟随', close:'后追'};
const MARGIN = 0.10;

// ---------- race model ----------
let field = [];      // horses in current race
let raceNo = LS.get('raceNo', 1);
let tickets = [];    // {hIdx, type:'W'|'P', amt, odds}
let betType = 'W';
let stake = 50;
let phase = 'bet';   // bet | countdown | race | result
let racePlan = null; // per-horse finishT + progress curves
let raceT0 = 0, raceT = 0, msgAt = {};
let photoFinish = false, ts = 1; // ts: timescale (test hook)
let dust = [];

function makeField(){
  const pool = shuffle(POOL).slice(0,6);
  const silks = shuffle(SILKS);
  const abil = pool.map(h=> h.baseAbil !== undefined ? h.baseAbil : rnd(-1,1));
  const pw = softmax(abil.map(a=>a*1.5));
  // place probabilities via Monte-Carlo Plackett-Luce
  const N=1400, plc = new Array(6).fill(0);
  for(let n=0;n<N;n++){
    const rk = sampleRanking(pw);
    for(let i=0;i<3;i++) plc[rk[i]]++;
  }
  const ppl = plc.map((c,i)=> clamp(c/N, pw[i]*1.05, 0.92));
  field = pool.map((h,i)=>({
    ...h, idx:i, silk:silks[i],
    pw: pw[i], ppl: ppl[i],
    winOdds:  oddsOf(pw[i], 0),
    placeOdds:oddsOf(ppl[i], 1)
  }));
  field.forEach(h=>{ const s=[...field].sort((a,b)=>b.pw-a.pw); h.stars = Math.max(1, 5 - s.indexOf(h)); });
  renderBoard();
}
function oddsOf(p, kind){
  const noise = rnd(-0.12, 0.12);
  const m = kind? MARGIN*1.15 : MARGIN;
  let o = (1/p) * (1-m) * (1+noise);
  o = Math.max(kind?1.1:1.2, o);
  o = o >= 10 ? Math.round(o) : Math.round(o*10)/10;
  return o;
}
// Plackett-Luce: sample full ranking given win-strength weights
// rem holds {v, i} pairs so ORIGINAL horse indices survive splicing
function sampleRanking(w){
  const rem = w.map((v,i)=>({v,i})), rk=[];
  while(rem.length){
    const s = rem.reduce((p,c)=>p+c.v,0);
    let x = Math.random()*s;
    for(let k=0;k<rem.length;k++){ x -= rem[k].v; if(x<=0){ rk.push(rem[k].i); rem.splice(k,1); break; } }
  }
  return rk;
}

// build animation plan for a known ranking
function buildPlan(){
  const rk = sampleRanking(field.map(h=>h.pw));       // rk[0] = winner idx
  const T = rnd(12.5, 15);
  const finishT = new Array(6);
  rk.forEach((hIdx, r)=>{ finishT[hIdx] = T * (1 + 0.055*r + rnd(0,0.035)); });
  photoFinish = (finishT[rk[1]] - finishT[rk[0]]) < 0.12;
  const K = 240, curves = [];
  for(let i=0;i<6;i++){
    const style = field[i].style;
    const a = style==='front'?1.20 : style==='close'?0.80 : 1.0;
    const b = style==='front'?0.80 : style==='close'?1.20 : 1.0;
    const vs = [];
    for(let k=0;k<K;k++){
      let v = Math.abs(rnd(1,1)===1?1: (Math.random()+Math.random()+Math.random())/1.5); // ~bell around 1
      v *= a + (b-a)*(k/K);
      vs.push(Math.max(0.15, v));
    }
    const s = vs.reduce((p,c)=>p+c,0);
    let acc=0; const cum = vs.map(v=>{ acc+=v/s; return acc; });
    cum[K-1]=1;
    curves.push(cum);
  }
  const ranking = rk.slice();
  racePlan = {finishT, curves, ranking, K};
  return racePlan;
}
function progressAt(hIdx, t){
  const {finishT, curves, K} = racePlan;
  const frac = clamp(t/finishT[hIdx], 0, 1);
  const x = frac*(K-1), i = Math.floor(x), f = x-i;
  const c = curves[hIdx];
  return i>=K-1 ? 1 : c[i]*(1-f)+c[i+1]*f;
}

// ---------- pixel horse sprites (28x16, 6-frame gallop cycle) ----------
// gallop phases: F0 suspension(stretched) F1 reach F2 support F3 drive F4 push F5 gather
function buildHorseFrame(f, coat, dark, silk, num){
  const cv = document.createElement('canvas'); cv.width=28; cv.height=16;
  const c = cv.getContext('2d');
  const P=(x,y,col)=>{ c.fillStyle=col; c.fillRect(x,y,1,1); };
  const R=(x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(x,y,w,h); };
  const L=(ax,ay,kx,ky,hx,hy)=>{ // leg: anchor->knee->hoof, 2px wide, dark hoof
    const seg=(x1,y1,x2,y2)=>{ const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1);
      for(let s=0;s<=n;s++) P(Math.round(x1+(x2-x1)*s/n), Math.round(y1+(y2-y1)*s/n), dark); };
    seg(ax,ay,kx,ky); seg(kx,ky,hx,hy);
    P(hx,hy,'#151515'); P(hx+1,hy,'#151515'); P(hx,hy-1,dark);
  };
  const yb = [-1,0,1,1,0,-1][f];            // body bob per frame
  const stretch = (f===0)?1:0;              // body elongates at full suspension
  // ---- tail (flaps on alternate frames) ----
  const tf = f%2;
  R(3,7+yb,2,3,dark); P(2,6+yb+(tf?0:1),dark); P(1,7+yb+(tf?1:0),dark); P(1,8+yb,dark);
  if(tf) P(0,8+yb,dark);
  // ---- hindquarters / body / chest (with stretch) ----
  R(5+stretch,6+yb,16,4,coat);              // barrel
  R(6+stretch,10+yb,13,1,dark);             // belly line
  P(4,7+yb,dark); R(5+stretch,7+yb,1,3,dark); // rump fade
  R(19+stretch,6+yb,3,3,coat);              // chest/shoulder mass
  // ---- neck + head ----
  R(21+stretch,4+yb,3,3,coat);              // lower neck
  R(23+stretch,2+yb,4,2,coat);              // upper neck
  R(25+stretch,1+yb,3,2,coat);              // head
  P(28,2+yb,dark); P(28,3+yb,dark);         // muzzle
  P(26,1+yb,'#111');                        // eye
  P(24+stretch,0+yb,dark); P(25+stretch,0+yb,dark); // ears
  // mane: dark strip along neck top
  R(22+stretch,1+yb,3,1,dark); P(21+stretch,2+yb,dark); P(22+stretch,2+yb,dark);
  // bridle line
  P(26,3+yb,dark);
  // ---- saddle cloth + number panel ----
  R(12+stretch,5+yb,4,1,silk);              // cloth behind jockey
  P(13+stretch,6+yb,silk);                  // cloth side drop
  // ---- jockey (crouched, silk colors, striped cap) ----
  R(14+stretch,3+yb,4,2,silk);              // torso
  P(13+stretch,4+yb,silk);                  // back edge
  P(18+stretch,3+yb,'#e8b796');             // face
  P(19+stretch,4+yb,'#e8b796');             // chin forward
  R(16+stretch,2+yb,3,1,'#f4f0e8');         // helmet stripe
  R(15+stretch,2+yb,1,1,silk);              // cap front
  P(17+stretch,4+yb,silk);                  // arm to neck
  P(15+stretch,2+yb,'#111');                // goggles
  // whip hint on drive frames
  if(f===3||f===4) P(20+stretch,2+yb,dark);
  // ---- legs: [hipA,hipB] hind, [shA,shB] front ----
  const hips  = [[9+stretch,10+yb],[12+stretch,10+yb]];
  const shs   = [[19+stretch,10+yb],[21+stretch,10+yb]];
  const D = [ // per frame: [hindA knee,hoof],[hindB knee,hoof],[frontA knee,hoof],[frontB knee,hoof]
    [ [[-3,-1],[-6, 2]], [[-2, 0],[-4, 3]], [[ 4,-2],[ 6, 1]], [[ 5,-1],[ 7, 2]] ], // F0 suspension
    [ [[-2, 1],[-4, 4]], [[-1, 1],[-2, 4]], [[ 3, 0],[ 5, 3]], [[ 4, 0],[ 6, 3]] ], // F1 reach
    [ [[-2, 2],[-3, 4]], [[-1, 2],[-1, 4]], [[ 1, 1],[ 1, 4]], [[ 2, 1],[ 3, 4]] ], // F2 support
    [ [[-3, 0],[-5, 2]], [[-2, 0],[-4, 3]], [[ 2,-1],[ 3, 1]], [[ 3,-1],[ 4, 2]] ], // F3 drive
    [ [[-3,-1],[-6, 1]], [[-2,-1],[-5, 2]], [[ 2,-2],[ 2,-1]], [[ 3,-2],[ 3, 0]] ], // F4 push
    [ [[-1, 0],[-2, 2]], [[ 0, 0],[-1, 2]], [[ 1,-2],[ 2, 0]], [[ 2,-2],[ 2, 0]] ]  // F5 gather
  ][f];
  hips.forEach((a,i)=> L(a[0],a[1], a[0]+D[i][0][0],a[1]+D[i][0][1], a[0]+D[i][1][0],a[1]+D[i][1][1]));
  shs .forEach((a,i)=> L(a[0],a[1], a[0]+D[i+2][0][0],a[1]+D[i+2][0][1], a[0]+D[i+2][1][0],a[1]+D[i+2][1][1]));
  return cv;
}
const spriteCache = {};
function horseSprite(h, f){
  f = ((f%6)+6)%6;
  const key = h.idx+':'+f;
  if(!spriteCache[key]) spriteCache[key] = buildHorseFrame(f, h.coat, h.dark, h.silk, h.idx+1);
  return spriteCache[key];
}

// ---------- live scene elements ----------
const crowdRows = [];   // {x, row, color, phase, jump}
(function seedCrowd(){
  const cols = ['#ef5d66','#ffcd75','#63c74d','#4d9be6','#d057d8','#f4f0e8','#e88c5a','#7bd1e8'];
  for(let row=0; row<3; row++){
    for(let x=8; x<W; x+=9){
      if(Math.random()<0.15) continue;  // gaps
      crowdRows.push({x:x+((row%2)*4), row, color:cols[rndi(0,cols.length-1)],
                      phase:Math.random()*Math.PI*2, jump: Math.random()<0.06});
    }
  }
})();
const clouds = [
  {x:60, y:10, s:1.0}, {x:300, y:16, s:0.7}, {x:520, y:8, s:1.2}, {x:680, y:18, s:0.6}
];
let confetti = [];
let shake = 0; // screen shake magnitude

function drawLiveScene(t){
  // clouds (drift slowly)
  ctx.save();
  clouds.forEach(cl=>{
    const cx = ((cl.x + t*6) % (W+120)) - 60;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillRect(cx, cl.y, 34*cl.s, 8*cl.s);
    ctx.fillRect(cx+6*cl.s, cl.y-5*cl.s, 18*cl.s, 6*cl.s);
  });
  ctx.restore();
  // animated crowd (bob sinusoidally, random jumpers during race)
  const excited = phase==='race' || phase==='countdown';
  const now = performance.now()/1000;
  crowdRows.forEach(p=>{
    const baseY = 50 + p.row*11;
    const bobAmt = excited? 2.2 : 0.8;
    const y = baseY + Math.sin(now*4 + p.phase)*bobAmt;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x, y, 4, 6);
    // head
    ctx.fillStyle='#e8b796';
    ctx.fillRect(p.x, y-3, 3, 3);
  });
  // bunting flags on the rail
  for(let x=8; x<W; x+=22){
    const wobble = Math.sin(now*2 + x*0.2)*1.5;
    ctx.fillStyle = (x/22|0)%2? '#ef5d66' : '#ffcd75';
    ctx.fillRect(x, 92+wobble, 8, 5);
    ctx.fillStyle = (x/22|0)%2? '#63c74d' : '#4d9be6';
    ctx.fillRect(x+11, 92-wobble, 8, 5);
  }
}

function drawGate(open){
  // start gate doors that swing open
  const gx = X0-14;
  ctx.fillStyle='#2a2e45'; ctx.fillRect(gx,TRACK_TOP,4,H-TRACK_TOP);
  // door panels
  for(let i=0;i<LANES;i++){
    const y = TRACK_TOP + i*LANE_H;
    ctx.fillStyle = open? '#3a3f63' : '#4a4f78';
    if(open){
      // door swung back: thin sliver against the post
      ctx.fillRect(gx+2, y+2, 3, LANE_H-6);
    }else{
      // closed door across the lane
      ctx.fillRect(gx+4, y+2, 22, LANE_H-6);
      ctx.fillStyle='#0c0d1a';
      ctx.fillRect(gx+4, y+2, 22, 2); ctx.fillRect(gx+4, y+LANE_H-6, 22, 2);
    }
  }
}

function drawFinishBanner(t){
  // overhead checkered banner at the finish, poles stand on the track edge
  const bx = FINISH_X + SPR_W - 52, by = TRACK_TOP - 40;
  // poles (36px, from cloth down to track top)
  ctx.fillStyle='#0c0d1a';
  ctx.fillRect(bx-4, by+12, 4, 28); ctx.fillRect(bx+36, by+12, 4, 28);
  // cloth: 9x3 checkers
  for(let x=0;x<9;x++) for(let y=0;y<3;y++){
    ctx.fillStyle = (x+y)%2? '#f4f0e8' : '#0c0d1a';
    ctx.fillRect(bx+x*4, by+y*4, 4, 4);
  }
}

function spawnConfetti(){
  confetti = [];
  const cols = ['#ef5d66','#ffcd75','#63c74d','#4d9be6','#d057d8','#f4f0e8'];
  for(let i=0;i<90;i++){
    confetti.push({x:rnd(80,W-80), y:rnd(-60,-5), vx:rnd(-30,30), vy:rnd(60,160),
                   s:rndi(3,6), c:cols[rndi(0,5)], rot:rnd(0,6.28), vr:rnd(-4,4)});
  }
}
function drawConfetti(dt){
  confetti.forEach(cf=>{
    cf.x += cf.vx*dt; cf.y += cf.vy*dt; cf.rot += cf.vr*dt;
    cf.vy += 40*dt;
    ctx.save(); ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot);
    ctx.fillStyle=cf.c; ctx.fillRect(-cf.s/2, -cf.s/2, cf.s, cf.s*0.7);
    ctx.restore();
  });
  confetti = confetti.filter(c=>c.y < H+20);
}


let lastFrame = performance.now();
function drawRace(t, dt){
  // screen shake on gate open
  ctx.save();
  if(shake>0.1){
    ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
    shake *= 0.88;
  }
  ctx.drawImage(bg,0,0);
  drawLiveScene(t);
  // start gate: open once race starts
  drawGate(phase==='race' || phase==='finishwait' || phase==='result');
  const running = phase==='race';
  // dust particles
  dust = dust.filter(d=>d.life>0);
  dust.forEach(d=>{
    ctx.fillStyle=`rgba(214,196,150,${d.life})`;
    ctx.fillRect(d.x|0, d.y|0, d.s, d.s);
    d.x-=d.vx; d.y+=d.vy; d.life-=0.03;
  });
  for(let i=0;i<6;i++){
    const h = field[i];
    const laneY = TRACK_TOP + i*LANE_H + (LANE_H - 16*SPRITE_SC)/2;
    let prog = 0;
    if(phase==='race') prog = progressAt(i, t);
    else if(phase==='finishwait' || phase==='result') prog = 1;
    const x = X0 + prog*(FINISH_X - X0);
    // gallop cadence scales with speed; each horse slightly offset
    const speed = racePlan? (prog < 1 ? 1/ (racePlan.finishT[i]||14) : 0) : 0;
    const fr = running? Math.floor(performance.now()/1000 * (7+speed*30) + i*1.7)%6 : 0;
    const y = laneY + ([-1,0,1,1,0,-1][fr])*SPRITE_SC*0.5;
    // speed lines behind fast horses in final stretch
    if(running && prog>0.8 && prog<1 && speed>0.075){
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.fillRect((x-14)|0, (y+8)|0, 10, 2);
      ctx.fillRect((x-20)|0, (y+22)|0, 14, 2);
    }
    ctx.drawImage(horseSprite(h, fr), x|0, y|0, 28*SPRITE_SC, 16*SPRITE_SC);
    // dust while running
    if(running && prog>0.01 && prog<0.995 && Math.random()<0.25){
      dust.push({x:x+rndi(0,14), y:y+56+rndi(0,6), s:rndi(3,7), vx:rnd(0.5,1.5), vy:rnd(-0.2,0.3), life:rnd(0.3,0.55)});
    }
    // number tag above
    ctx.fillStyle='#0c0d1a'; ctx.fillRect(x|0, y-13, 16, 12);
    ctx.fillStyle=h.silk;    ctx.fillRect((x|0)+1, y-12, 14, 10);
    ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText(String(i+1), (x|0)+8, y-3);
  }
  drawFinishBanner(t);
  drawConfetti(dt||0.016);
  ctx.restore();
}

// ---------- DOM: board / tickets ----------
function renderBoard(){
  const bd = $('#board'); bd.innerHTML='';
  field.forEach(h=>{
    const d = document.createElement('div');
    d.className='hcard'; d.dataset.idx=h.idx;
    const stakeOn = tickets.filter(t=>t.hIdx===h.idx).reduce((p,c)=>p+c.amt,0);
    if(stakeOn>0) d.classList.add('hasbet');
    d.innerHTML = `
      <div class="betmark">注${fmt(stakeOn)}</div>
      <div class="r1">
        <div class="cap" style="background:${h.silk}">${h.idx+1}</div>
        <div class="nm">${h.name}</div>
      </div>
      <div class="r2">
        <span class="wodds num">${h.winOdds.toFixed(1)}</span>
        <span class="podds num">位 ${h.placeOdds.toFixed(1)}</span>
      </div>
      <div class="r3">
        <span class="stars">${'★'.repeat(h.stars)}${'☆'.repeat(5-h.stars)}</span>
        <span class="tag">${STYLE_TAG[h.style]}</span>
      </div>`;
    d.addEventListener('click', ()=> onCardTap(h.idx));
    bd.appendChild(d);
  });
  updateDole();
}
function onCardTap(idx){
  if(phase!=='bet'){ toast('比赛中不能下注'); return; }
  const amt = stake==='max' ? bank : stake;
  if(amt<=0 || bank<10){ toast('余额不足'); updateDole(); return; }
  const real = Math.min(amt, bank);
  if(real<10){ toast('最低下注 10'); return; }
  const h = field[idx];
  const odds = betType==='W'? h.winOdds : h.placeOdds;
  tickets.push({hIdx:idx, type:betType, amt:real, odds});
  bank -= real; saveBank();
  sfx.chip(); renderTickets(); renderBoard();
}
function renderTickets(){
  const tk = $('#tickets'); tk.innerHTML='';
  tickets.forEach((t,i)=>{
    const h = field[t.hIdx];
    const d = document.createElement('div'); d.className='tk';
    d.innerHTML = `<span class="tt ${t.type}">${t.type==='W'?'独赢':'位置'}</span>
      <span style="color:${h.silk}">■</span> ${h.name}
      <span class="num">@${t.odds.toFixed(1)}</span>
      <span class="amt num">-${t.amt}</span>
      <button class="x" data-i="${i}">✕</button>`;
    d.querySelector('.x').addEventListener('click', e=>{
      if(phase!=='bet') return;
      const i2 = +e.target.dataset.i; const t2 = tickets[i2];
      bank += t2.amt; saveBank();
      tickets.splice(i2,1); sfx.click(); renderTickets(); renderBoard();
    });
    tk.appendChild(d);
  });
  const total = tickets.reduce((p,c)=>p+c.amt,0);
  const go = $('#go');
  if(phase==='bet'){
    go.disabled = tickets.length===0;
    go.textContent = total>0 ? `開 跑 · 总注 ${fmt(total)}` : '開 跑';
  }
}
function saveBank(){ $('#bankVal').textContent = fmt(bank); LS.set('bank', bank); }
function updateDole(){
  $('#doleBtn').style.display = (phase==='bet' && bank<10 && tickets.length===0)? 'block':'none';
}
let toastTimer=null;
function toast(msg){

// ---------- countdown & race ----------
function startRace(){

function beginRun(){

function raceMsg(txt, ms=1100){

}
function liveTick(t){
  const order = field.map((h,i)=>({i, p:progressAt(i,t)})).sort((a,b)=>b.p-a.p);
  const lb=$('#liveBar');
  lb.innerHTML = order.map((o,r)=>`<span class="lb"><b>${r+1}</b><i style="background:${field[o.i].silk}"></i>${field[o.i].name}</span>`).join('');
  // narrative banners
  const lead = progressAt(order[0].i, t);
  const rel = t / Math.max(...racePlan.finishT);
  if(rel>0.3 && !msgAt[0.3]){ msgAt[0.3]=true; raceMsg(`「${field[order[0].i].name}」带头!`); }
  if(rel>0.62 && !msgAt[0.62]){ msgAt[0.62]=true; raceMsg('後方马匹开始发力!'); }
  if(rel>0.86 && !msgAt[0.86]){ msgAt[0.86]=true; raceMsg('最後直路!!'); }

// ---------- settle ----------
function settleRace(){
  phase='result';
  $('#liveBar').style.display='none';
  const hadWinner = tickets.some(t=>{
    const r = racePlan.ranking.indexOf(t.hIdx);
    return t.type==='W'? r===0 : r<3;
  });
  if(hadWinner && bank>0) spawnConfetti();   // celebrate a paying race
  const rk = racePlan.ranking;             // rk[r] = horse idx at place r+1
  const rankOf = []; rk.forEach((h,r)=>rankOf[h]=r);
  const t1 = racePlan.finishT[rk[0]], t2 = racePlan.finishT[rk[1]];
  let payout=0;
  const rows = tickets.map(t=>{
    const r = rankOf[t.hIdx];
    const win = t.type==='W'? r===0 : r<3;
    const pay = win? Math.round(t.amt*t.odds) : 0;
    payout += pay;
    if(win && pay-t.amt > stats.biggestWin) stats.biggestWin = pay-t.amt;
    return {...t, r, pay};
  });
  bank += payout; saveBank();
  stats.races++; stats.staked += tickets.reduce((p,c)=>p+c.amt,0);
  stats.returned += payout; stats.tickets += tickets.length;
  stats.paidTickets += rows.filter(r=>r.pay>0).length;
  stats.curve.push(bank); if(stats.curve.length>160) stats.curve.shift();
  LS.set('stats', stats); LS.set('raceNo', raceNo+1);

  sfx.fanfare();
  if(payout>0){ setTimeout(()=>sfx.cash(), 700); if(navigator.vibrate) navigator.vibrate([40,60,40]); }
  else setTimeout(()=>sfx.lose(), 700);

  // render modal
  $('#resTitle').textContent = photoFinish? '📸 同場影相!' : '🏁 赛 果';
  $('#ranks').innerHTML = rk.map((h,r)=>{
    const hh=field[h];
    const gap = r===0? '冠军' : `+${((racePlan.finishT[h]-t1)).toFixed(2)}秒`;
    return `<div class="rk ${r===0?'first':''}">
      <span class="pos">${r+1}</span>
      <span class="cap" style="background:${hh.silk}"></span>
      <span>${hh.name}</span>
      <span class="gap num">${gap}</span></div>`;
  }).join('');
  $('#settle').innerHTML = rows.length? rows.map(t2r=>{
    const hh=field[t2r.hIdx];
    return `<div class="stk">
      <span class="tt ${t2r.type}" style="font-size:10px;font-weight:900;padding:1px 4px;border:1px solid var(--border);color:${t2r.type==='W'?'var(--gold)':'var(--blue)'}">${t2r.type==='W'?'独赢':'位置'}</span>
      <span>${hh.name} · ${fmt(t2r.amt)}@${t2r.odds.toFixed(1)}</span>
      <span class="res ${t2r.pay>0?'win':'lose'}">${t2r.pay>0? '+'+fmt(t2r.pay) : '✗'}</span></div>`;
  }).join('') : '<div class="stk" style="color:var(--dim)">本场无注单</div>';
  const stakeTot = tickets.reduce((p,c)=>p+c.amt,0);
  const net = payout - stakeTot;
  const nr=$('#netRow');
  nr.className = 'net ' + (net>0?'pos':net<0?'neg':'zero');
  nr.innerHTML = `本場净额 <b class="num">${net>0?'+':''}${fmt(net)}</b><br><span style="font-size:12px;color:var(--dim)">余额 💰${fmt(bank)}</span>`;
  $('#resultModal').classList.add('show');
  tickets = []; renderTickets(); renderBoard();
}

// ---------- main loop ----------
let lastLoop = performance.now();
function loop(now){
  const dt = Math.min((now-lastLoop)/1000, 0.05);
  lastLoop = now;
  if(phase==='race'){
    raceT = (now - raceT0)/1000*ts;
    const maxT = Math.max(...racePlan.finishT);
    if(photoFinish && raceT > maxT*0.93 && raceT < maxT*1.02){
      // slow-mo drama at tight finishes
      raceT = maxT*0.93 + (raceT - maxT*0.93)*0.35;
    }
    liveTick(Math.min(raceT, maxT));
    drawRace(Math.min(raceT, maxT+0.4), dt);
    if(raceT > maxT + 0.5){
      drawRace(maxT+2, 0.016); raceMsg(photoFinish? '影相判定中…':'終點!', 800);
      setTimeout(settleRace, photoFinish? 900 : 350);
      phase='finishwait';
    }
  } else if(phase==='result' || phase==='finishwait'){
    drawRace(1e9, dt);
  } else {
    drawRace(performance.now()/1000, dt);
  }
  requestAnimationFrame(loop);
}

// ---------- stats modal ----------
function showStats(){
  const g=$('#statGrid');
  const roi = stats.staked>0? ((stats.returned-stats.staked)/stats.staked*100) : 0;
  const hit = stats.tickets>0? (stats.paidTickets/stats.tickets*100) : 0;
  g.innerHTML = `
    <div><span>参加场次</span><b class="num">${stats.races}</b></div>
    <div><span>总投注额</span><b class="num">${fmt(stats.staked)}</b></div>
    <div><span>总派彩</span><b class="num">${fmt(stats.returned)}</b></div>
    <div><span>实际 ROI</span><b class="num" style="color:${roi>=0?'var(--green)':'var(--red)'}">${roi>=0?'+':''}${roi.toFixed(1)}%</b></div>
    <div><span>注单命中率</span><b class="num">${hit.toFixed(1)}%</b></div>
    <div><span>最大单笔盈利</span><b class="num" style="color:var(--green)">+${fmt(stats.biggestWin)}</b></div>
    <div><span>领低保次数</span><b class="num">${stats.dole}</b></div>
    <div><span>当前余额</span><b class="num" style="color:var(--gold)">${fmt(bank)}</b></div>`;
  const sc=$('#spark'), c=sc.getContext('2d');
  c.fillStyle='#2d3252'; c.fillRect(0,0,sc.width,sc.height);
  const cv2=stats.curve; if(cv2.length>1){
    const mn=Math.min(...cv2), mx=Math.max(...cv2), rg=Math.max(1,mx-mn);
    c.strokeStyle='#ffcd75'; c.lineWidth=2; c.beginPath();
    cv2.forEach((v,i)=>{
      const x=i/(cv2.length-1)*(sc.width-8)+4;
      const y=sc.height-6-((v-mn)/rg)*(sc.height-14);
      i? c.lineTo(x,y): c.moveTo(x,y);
    });
    c.stroke();
    c.fillStyle='#8b90b3'; c.font='10px monospace';
    c.fillText('资金曲线 '+fmt(mn)+'~'+fmt(mx), 6, 12);
  } else { c.fillStyle='#8b90b3'; c.font='10px monospace'; c.fillText('资金曲线：先去跑一场', 8, 34); }
  $('#statsModal').classList.add('show');
}

// ---------- test hooks (dev) ----------
window.__test = {
  get field(){return field;}, get tickets(){return tickets;}, get bank(){return bank;},
  get phase(){return phase;}, get plan(){return racePlan;}, get stats(){return stats;},
  setTS(v){ts=v;}, setBank(v){bank=v; saveBank();},
  place(hIdx, type, amt){ betType=type; tickets.push({hIdx,type:'W',amt,odds:type==='W'?field[hIdx].winOdds:field[hIdx].placeOdds}); if(tickets[tickets.length-1].type!==type)tickets[tickets.length-1].type=type; },
  clearTickets(){ tickets=[]; },
  start: startRace, makeField, buildPlan, sampleRanking,
  settleNow(){ if(phase==='race'||phase==='countdown'){ phase='race'; raceT0 = performance.now() - (Math.max(...racePlan.finishT)+1)*1000/ts; } },
  MC(n){ // monte-carlo calibration
    let favWins=0, roiSum=0, overSum=0;
    for(let it=0; it<n; it++){
      makeField();
      overSum += field.reduce((p,h)=>p+1/h.winOdds,0);
      const f = field.reduce((a,b)=> a.winOdds<b.winOdds? a:b);
      const rk = sampleRanking(field.map(h=>h.pw));
      if(rk[0]===f.idx) favWins++;
      const h = field[rndi(0,5)];
      const win = rk.indexOf(h.idx)===0;
      roiSum += (win? h.winOdds : 0) - 1;
    }
    return {favWinRate: favWins/n, randomBetROI: roiSum/n, avgOverround: overSum/n};
  }
};
